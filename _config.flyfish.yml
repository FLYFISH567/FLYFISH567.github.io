# FLYFISH — 清新蓝白，文章与生活共用一套导航。
avatar: https://flyfish567.oss-cn-shenzhen.aliyuncs.com/web.img1.jpg
hero_image: https://flyfish567.oss-cn-shenzhen.aliyuncs.com/web.imgbackground.jpg
hero_title: 日子慢慢过，故事慢慢写。
github: https://github.com/FLYFISH567
bilibili: https://space.bilibili.com/351361938
# 侧栏头像下面的身份标签；增加一行即可增加标签，建议保持 1～3 项。
profile_roles:
  - 学生
# 页脚短句采用句首大写；可在这里直接替换整句话。
footer_motto: Love and be loved
# 留白上的鼠标水波：点击泛起涟漪，按住左键拖动留下短暂尾迹。设为 false 可完全关闭。
# 触屏和系统“减少动态效果”模式下自动停用。
pointer_play: true
# 固定相册封面（可选）：键是 album.yml 的 path_name，值是图片地址。
# album_covers:
#   /wordScenery: https://你的图床/封面.jpg
explore:
  # 仅从随机照片中跳过已确认失效的资源，不修改相册原始记录。
  exclude_images:
    - https://bu.dusays.com/2023/04/09/643293997b92b.jpeg
music:
  # 你的网易云歌单 ID。播放权取决于网易云的公开外链权限，不自动播放。
  id: '12908278323'
  server: netease
  # 2026-10-27 实测：旧 api.injahow.cn 仍返回 35 首，新接口与网易云的 29 首及顺序一致。
  # 旧服务即使附加时间戳也会返回过期歌单，不将它作为回退，避免恢复已删除的歌曲。
  # 更换服务时保留 :server / :type / :id 占位符；不要填写账号 Cookie。
  api: 'https://meting.mikus.ink/api?server=:server&type=:type&id=:id'
  # 可填写自有公开 Meting 服务，主接口失败后依次尝试。
  fallback_apis: []
  # 可选：自托管 JSON 歌单（优先加载），使用自己有权发布的完整音频。
  # 格式及示例见 CONTENT_GUIDE.md 的“音乐”段落。
  playlist_url: ''
  # 原歌单 + 从两份酷狗收藏中筛选、创建的网易云分类歌单。
  # 新分类的音频走网易云官方免费外链；在线歌单接口失败时才加载核验过的本站备份。
  # audio_api 中的 :id 指歌曲 ID；api 中的 :id 指歌单 ID。
  playlists:
    - name: FLYFISH_World
      id: '12908278323'
      description: '01–15 安静入座 · 16–30 提速专注 · 31–57 课间放松'
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/original.json'
      backup_checked_at: '2026-10-27'
    - name: 留白时刻｜纯音乐
      id: '18530770239'
      description: 钢琴、器乐、游戏配乐与电子纯音乐。
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/instrumental.json'
      backup_checked_at: '2026-10-27'
    - name: 晴空电台｜日语
      id: '18530890597'
      description: 日语流行、动漫与电子旋律，按原版本整理。
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/japanese.json'
      backup_checked_at: '2026-10-27'
    - name: 日常心事｜华语
      id: '18530881693'
      description: 华语流行与说唱，熟悉的词句，随手循环。
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/chinese.json'
      backup_checked_at: '2026-10-27'
    - name: 世界漫游｜外语
      id: '18530938406'
      description: 英语、韩语等不同语种的旋律，一路换换风景。
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/world.json'
      backup_checked_at: '2026-10-27'
    - name: 偏爱循环｜精选
      id: '18530838929'
      description: 第二份收藏里通过核验的曲目。
      audio_api: 'https://music.163.com/song/media/outer/url?id=:id'
      backup_playlist_url: '/music/playlists/favorites.json'
      backup_checked_at: '2026-10-27'
summaries:
  如何快速完成Github学生认证: 从个人资料、学校邮箱到双重身份验证，记录一次 GitHub 学生认证的申请过程。
  魔术方法构造和析构: 梳理构造、析构和序列化相关魔术方法的触发时机，结合 PHP 示例回看。
  PHP反序列化基础知识: 从类、对象和成员属性开始，整理 PHP 面向对象与反序列化的基础知识。
  SQL注入原理: 从输入与代码的边界出发，整理 SQL 注入的成因、常用函数和联合查询流程。
  3.24 周二晚: 想起一些和身体、焦虑有关的小事。今天早点睡吧，晚安。
  SSRF漏洞原理: 关于服务端请求伪造的概念、成因与学习记录。
  XSS-labs靶场搭建: 记录 XSS-labs 环境搭建的参考资料，以及目录和访问路径的注意事项。
  文件上传漏洞: 梳理上传校验、服务端解析与常见绕过方式，整理靶场中遇到的题型。
  一句话木马大全: 文件上传学习过程中收集的代码片段，按脚本语言整理，便于回看。
  upload-labs: 结合 upload-labs 记录文件上传校验的判断方法、常见绕过与解题过程。
  PHP命令执行靶场搭建: 从 WSL2、Kali 到 Docker，整理靶场搭建的参考资料和过程中的问题。
