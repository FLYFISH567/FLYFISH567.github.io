# 书影音收藏。填写真实的记录后重新生成网站；留空时显示等待收藏的卡片。
# date 建议加引号，如 '2026-10-29'。cover 可填站内路径或 https 图片地址。
# summary 用于作品简介，source 为原始资料链接。个人感想可另填 note。
# status、date、rating、note、quote、cover 都可省略；rating 使用 1–5 分。
films:
  - title: 绿皮书
    creator: 彼得·法雷里 导演
    summary: 1962 年，一位黑人钢琴家与他的司机踏上美国南部巡演之路。旅途让两个背景迥异的人逐渐了解彼此。
    source: 'https://www.universalpicturesathome.com/movies/green-book'
    # IMDb 电影海报，作品：Green Book（2018）。
    cover: 'https://m.media-amazon.com/images/M/MV5BYTMxMzNlMDYtYzhlMS00ODMxLWFlM2MtY2U4NzJmOGM3ZTljXkEyXkFqcGc%40._V1_FMjpg_UX1000_.jpg'
  - title: 肖申克的救赎
    creator: 弗兰克·德拉邦特 导演
    summary: 银行家安迪入狱后与瑞德成为朋友。故事从瑞德的视角回望漫长的监狱生活，以及两人各自怎样理解希望。
    source: 'https://stephenking.com/works/movie/shawshank-redemption.html'
    # Stephen King 官方作品资料页面提供的电影海报。
    cover: 'https://stephenking.com/images/movies/theatrical_movie/the_shawshank_redemption/us3_.jpg'
books:
  - title: 三体
    creator: 刘慈欣 著
    summary: 从一次向宇宙发出的信号，到人类得知另一个文明的存在。小说把科学谜题和人类面对未知时的选择连在一起。
    source: 'https://us.macmillan.com/books/9780765377067/thethreebodyproblem/'
    # 新华书店的重庆出版社版本封面。
    cover: 'https://img5.xinhuashudian.com/images/2020/07/29/ee5f947a-5cfe-4c8a-a5a3-846deca1c355.jpg?x-oss-process=image%2Fresize%2Cm_mfit%2Ch_750%2Cw_750'
  - title: 铃芽之旅
    creator: 新海诚 著
    summary: 铃芽遇到正在寻找神秘门扉的草太，随之踏上穿越日本的旅途。门后牵连着灾难，也牵动她对往事的记忆。
    source: 'https://yenpress.com/titles/9781975373078-suzume'
    # Bookshop.sg 所列新星出版社简体中文版封面。
